<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Gen Green Newark | Thank You</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />

</head>


<body class="thankyou-body">


  <!-- =========================================
       HEADER
  ========================================== -->

  <header class="thankyou-header">

    <img
      src="images/gen-green.png"
      alt="Gen Green"
      class="thankyou-logo"
    />

  </header>



  <!-- =========================================
       MAIN
  ========================================== -->

  <main class="thankyou-main">


    <section class="thankyou-card">


      <!-- ICON -->

      <div class="thankyou-icon">
        ✓
      </div>



      <!-- HEADING -->

      <p class="thankyou-eyebrow">
        YOU'RE ALL DONE!
      </p>


      <h1>
        Thank You for Voting Green!
      </h1>


      <p class="thankyou-message">
        Your voice is helping shape a greener Newark.
        Thank you for sharing your ideas and participating
        in the Gen Green initiative.
      </p>



      <!-- TAGLINE -->

      <div class="thankyou-tagline">
        My Voice. My Newark. My Future. 
      </div>



      <!-- SMALL MESSAGE -->

      <div class="thankyou-note">

        <span class="thankyou-leaf">
          🌿
        </span>

        <p>
          Your vote and survey have been successfully completed.
        </p>

      </div>



      <!-- BUTTON -->

      <div class="thankyou-actions">

        <a
          href="index.html"
          class="thankyou-home-button"
          id="returnHomeButton"
        >
          Return to Home
        </a>


        <button
         type="button"
         id="withdrawVoteButton"
         class="withdraw-vote-button"
>
         Withdraw My Vote
         </button>

      </div>


    </section>


  </main>



  <!-- =========================================
       BOTTOM BRANDING
  ========================================== -->

  <footer class="thankyou-footer">

    <div class="thankyou-brand-logos">


      <img
        src="images/newark-logo.png"
        alt="City of Newark"
      />


      
      <img
        src="images/mayor-logo.png"
        alt="City of Newark Seal"
      />



      <img
        src="images/sustainability-logo.png"
        alt="Office of Sustainability"
      />


      <img
        src="images/gen-green.png"
        alt="Gen Green"
      />


    </div>

  </footer>



  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/thank-you.js"></script>


</body>

</html>
