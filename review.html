<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Gen Green Newark | Review Your Choices</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="review-body">

  <!-- =====================================
       HEADER
  ====================================== -->

  <header class="review-header">

    <a href="vote.html" class="review-back">
      ← Edit Choices
    </a>

    <img
      src="images/gen-green.png"
      alt="Gen Green"
      class="review-logo"
    />

    <div class="review-step">
      Step 2 of 4
    </div>

  </header>


  <!-- =====================================
       MAIN
  ====================================== -->

  <main class="review-main">

    <section class="review-intro">

      <p class="review-eyebrow">
        ALMOST THERE!
      </p>

      <h1>
        Review Your Choices
      </h1>

      <p>
        Take one more look at your Top 5 ideas before submitting your vote.
      </p>

    </section>


    <!-- =====================================
         CHOICE LIST
    ====================================== -->

    <section class="review-card">

      <div class="review-card-header">

        <div>
          <p class="review-label">
            YOUR TOP 5
          </p>

          <h2>
            Your selected ideas
          </h2>
        </div>


        <div class="review-count">
          5 choices
        </div>

      </div>


      <div
        id="reviewChoices"
        class="review-choices"
      >
        <!-- JavaScript inserts choices here -->
      </div>

    </section>


    <!-- =====================================
         ACTIONS
    ====================================== -->

<!-- =====================================
     FIXED REVIEW FOOTER
====================================== -->

<footer class="review-footer">

  <div class="review-footer-inner">

    <div class="review-footer-status">
      <strong>5 of 5</strong>
      <span>ideas selected</span>
    </div>


    <div class="review-footer-message">
      <span class="footer-check">✓</span>

      <span>
        Your choices are ready to submit
      </span>
    </div>


    <div class="review-footer-actions">

      <a
        href="vote.html"
        class="change-choices-button"
      >
        ← Change My Choices
      </a>


    <button
  type="button"
  id="submitVoteButton"
  class="submit-vote-button"
>
  Continue to Survey →
</button>

    </div>

  </div>

</footer>


<script src="js/review.js"></script>

</body>
</html>
